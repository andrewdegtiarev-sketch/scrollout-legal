<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Support and privacy information for Scroll.Out.">
    <title>Scroll.Out — Support</title>
    <style>
      :root { color-scheme: light; --ink: #29234d; --muted: #68617e; --surface: #f3eff8; --accent: #8760a7; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px 20px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--ink); background: #fcfaff; }
      main { width: min(100%, 680px); padding: 44px; border: 1px solid #e8e0ef; border-radius: 28px; background: white; box-shadow: 0 18px 55px rgba(67, 43, 90, .08); }
      .mark { display: grid; place-items: center; width: 52px; height: 52px; margin-bottom: 24px; border-radius: 50%; background: var(--surface); color: #d65f73; font-size: 25px; }
      h1 { margin: 0 0 12px; font-size: clamp(2rem, 7vw, 3rem); letter-spacing: -.04em; }
      p { margin: 0; color: var(--muted); font-size: 1.05rem; line-height: 1.6; }
      nav { display: grid; gap: 12px; margin-top: 32px; }
      a { display: block; padding: 17px 20px; border-radius: 16px; background: var(--surface); color: var(--ink); font-weight: 700; text-decoration: none; }
      a:hover, a:focus-visible { outline: 3px solid #c9b1dc; outline-offset: 2px; }
      footer { margin-top: 32px; color: var(--muted); font-size: .86rem; }
      @media (max-width: 520px) { main { padding: 30px 24px; } }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">♥</div>
      <h1>Scroll.Out</h1>
      <p>Support and privacy information for Scroll.Out, an app for protecting time set aside for rest.</p>
      <nav aria-label="Legal and support links">
        <a href="support.html">Get support</a>
        <a href="privacy.html">Privacy Policy</a>
      </nav>
      <footer>© 2026 Andrey Degtiarev</footer>
    </main>
  </body>
</html>
